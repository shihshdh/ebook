name: iOS personal build
on:
  push:
    branches: [codex/ios-personal]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'scripts/*ios*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify iOS platform routing
        run: node --test scripts/ios-platform-test.mjs
      - name: Build unsigned iPhone package
        run: npm run ios:build
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOK-iOS-unsigned
          path: |
            release/*_ios-unsigned.ipa
            release/*_ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Launch on an iPhone simulator
        timeout-minutes: 12
        run: bash scripts/smoke-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBOOK-iOS-smoke
          path: |
            release/ios-first-launch.png
            release/ios-processes.txt
            release/ios-bridge-selftest.json
            release/ios-diag/
          if-no-files-found: warn
  # 界面巡检：和打包并行，在 SE / 16 Pro / 16 Pro Max 模拟器（外加深色模式）里把各屏走一遍截图
  tour:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync web assets into the iOS project
        run: npm run ios:sync
      - name: Walk through the app on iPhone simulators
        timeout-minutes: 42
        run: bash scripts/tour-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBOOK-iOS-tour
          path: release/ios-tour/
          if-no-files-found: warn
          retention-days: 14
