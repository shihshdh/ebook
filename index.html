<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <!-- 封面走的图片代理和 Bangumi：页面一加载就先把连接建好，第一批封面省掉一次 DNS + TLS 握手 -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://i0.wp.com" />
    <link rel="preconnect" href="https://lain.bgm.tv" />
    <link rel="preconnect" href="https://api.bgm.tv" />
    <!-- 首帧前定好明暗，避免先闪一下另一种底色 -->
    <script>try{var a=(JSON.parse(localStorage.getItem('librarium.accounts')||'null')||{}).current,k='librarium.theme'+(a&&a!=='default'?'@'+a:'');var v=localStorage.getItem(k);if(v==='system')v=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',v==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
    <!-- Native / pre-React frame share an intentionally empty brand surface. -->
    <script>try{if(!sessionStorage.getItem('librarium.splash')&&!location.hash.startsWith('#/read'))document.documentElement.setAttribute('data-splash-boot','')}catch(e){document.documentElement.setAttribute('data-splash-boot','')}</script>
    <style>html[data-splash-boot]::before{content:"";position:fixed;inset:0;z-index:201;background:#B64E38}html[data-splash-boot]{background:#B64E38}html[data-splash-boot]:has(#root > *)::before{display:none}</style>
    <title>EBOOK</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
